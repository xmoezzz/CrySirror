name: desktop-and-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/desktop_project.py examples/desktop/project.json --assets
      - run: python tools/validate_project.py examples/fusion.json
      - run: python tools/upstreams.py validate-config
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            exe: crysirror
          - os: windows-latest
            target: windows
            exe: crysirror.exe
          - os: macos-latest
            target: macos
            exe: crysirror
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build and software-GPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev pkg-config mesa-vulkan-drivers libegl1 xvfb
      - name: Install current stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Resolve dependencies and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Core stays independent of GPU and windowing
        run: cargo check --locked -p crysirror-core -p crysirror-compat
      - name: Compile and run non-GPU Rust tests
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets
      - name: Build this runner's executable
        run: cargo build --locked --release -p crysirror-desktop
      - name: Real Vulkan pixel and window smoke tests
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp/crysirror-xdg
          WGPU_BACKEND: vulkan
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          LVP_ICD="$(find /usr/share/vulkan/icd.d -name 'lvp*.json' -print -quit)"
          test -n "$LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          cargo test --locked -p crysirror-wgpu --test gpu_smoke -- --ignored --nocapture
          xvfb-run -a target/release/crysirror run examples/desktop/project.json --frames 3 --no-audio --capture dist/window-smoke.png
          target/release/crysirror render examples/desktop/project.json --output dist/headless.png
      - name: Package this platform (no cross-compilation claim)
        run: python tools/package_game.py --project examples/desktop/project.json --executable target/release/${{ matrix.exe }} --target ${{ matrix.target }} --output dist/CrySirror-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CrySirror-${{ matrix.target }}
          path: |
            dist/
            Cargo.lock
  siglus-resource-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the CPU-only compatibility port
        run: cargo +stable test --locked -p crysirror-siglus -p crysirror-scene
      - name: Fetch pinned references outside the deliverable tree
        run: python tools/upstreams.py fetch --source-root "${{ runner.temp }}/crysirror-references"
      - name: Execute original resource decoder and compare
        run: python tools/compare_siglus_resources.py --source-root "${{ runner.temp }}/crysirror-references/siglus_rs"
      - name: Execute pinned CPU input/animation/projection/UI comparison
        run: python tools/compare_scene_upstream.py --source-root "${{ runner.temp }}/crysirror-references"
