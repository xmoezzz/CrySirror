name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Link the full player, with a smaller CI build footprint than production LTO.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo_jobs: 4
          - os: windows-2022
            cargo_jobs: 4
          - os: macos-latest
            cargo_jobs: 2
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: crysirror-release-v1-${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --version
          cargo +stable --version

      - name: Cache dependency sources
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust compilation results
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
          # Its post action assumes installation succeeded. Collect stats below
          # only after the wrapper was actually enabled.
          disable_annotations: true

      - name: Enable available compiler cache
        if: steps.sccache.outcome == 'success'
        run: |
          if sccache --version && sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::Compiler cache unavailable; building directly with rustc"
          fi

      - name: Build release player
        run: cargo +stable build --release --locked --timings -p crysirror-desktop --bin crysirror

      - name: Report compiler cache statistics
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        continue-on-error: true
        run: sccache --show-stats

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
