[package]
name = "crysirror-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Device-free video decoding: OMV/Theora, MPEG-1/2, WMV/VC-1 and MP4 AVC/HEVC/AV1"

[dependencies]
crysirror-image.workspace = true
anyhow.workspace = true
amv_decoder = { package = "crysirror-codec-amv", path = "../crysirror-codec-amv" }
siglus_omv_decoder = { package = "crysirror-codec-omv", path = "../crysirror-codec-omv" }
na_mpeg2_decoder = { package = "crysirror-codec-mpeg", path = "../crysirror-codec-mpeg" }
wmv-decoder = { package = "crysirror-codec-wmv", path = "../crysirror-codec-wmv", default-features = false, features = ["audio"] }

# Native Rust codecs; exact versions keep the source audit reproducible.
oxideav-core = "=0.1.42"
oxideav-mp4 = "=0.0.10"
oxideav-h264 = { git = "https://github.com/OxideAV/oxideav-h264", rev = "f8404d8edfa5a4f4dff500704458da52695c24aa" }
oxideav-h265 = { git = "https://github.com/OxideAV/oxideav-h265", rev = "276406e4288e5333c6d6d184f2a6d36e72010ba5" }
oxideav-av1 = { git = "https://github.com/OxideAV/oxideav-av1", rev = "b3c95abe071037bb8ecf06dfc6ec17f1424a380d" }
oxideav-pixfmt = "=0.1.11"
