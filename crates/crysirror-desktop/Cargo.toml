[package]
name = "crysirror-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "crysirror_player"

[[bin]]
name = "crysirror"
path = "src/main.rs"

[features]
# Every native VM and format provider is linked unconditionally: a plain
# `cargo build` is the complete player, including nfs:// and smb:// game
# sources on the host. Only host-device choices remain optional.
default = ["audio", "gamepad", "nfs", "smb"]
audio = ["crysirror-audio/cpal-output"]
gamepad = ["dep:gilrs"]
nfs = ["crysirror-launch/nfs", "crysirror-siglus-integrated/nfs", "crysirror-bgi-integrated/nfs", "crysirror-softpal/nfs", "crysirror-rfvp-integrated/nfs"]
smb = ["crysirror-launch/smb", "crysirror-siglus-integrated/smb", "crysirror-bgi-integrated/smb", "crysirror-softpal/smb", "crysirror-rfvp-integrated/smb"]
acoustics-obvhs = ["crysirror-engine/acoustics-obvhs"]

[dependencies]
crysirror-launch.workspace = true
crysirror-library.workspace = true
crysirror-qlie = {workspace=true,features=["runtime"]}
crysirror-sugarpot = {workspace=true,features=["runtime"]}
crysirror-reallive.workspace = true
crysirror-avg32.workspace = true
crysirror-krkr.workspace = true
crysirror-rfvp.workspace = true
crysirror-rfvp-integrated = {path="../crysirror-rfvp-integrated"}
crysirror-rfvp-vm.workspace = true
crysirror-siglus-integrated.workspace = true
crysirror-nscripter.workspace = true
crysirror-bgi-integrated.workspace = true
crysirror-softpal.workspace = true
crysirror-circus = {workspace=true,features=["runtime"]}
crysirror-catsystem2 = {workspace=true,features=["runtime"]}
crysirror-majiro = {workspace=true,features=["runtime"]}
crysirror-system-nnn = {workspace=true,features=["runtime"]}
crysirror-system4 = {path="../crysirror-system4",features=["runtime"]}
crysirror-core.workspace = true
crysirror-tasks.workspace = true
crysirror-willplus.workspace = true
crysirror-resource.workspace = true
crysirror-network = { workspace = true, features = ["smb", "nfs", "http"] }
crysirror-formats-arc.workspace = true
crysirror-tjs2.workspace = true
crysirror-runtime = { workspace = true, features = ["arc-formats", "blackcyc-formats"] }
crysirror-wgpu.workspace = true
crysirror-audio.workspace = true
crysirror-siglus.workspace = true
crysirror-engine = { workspace = true, features = ["arc-formats", "blackcyc-formats"] }
crysirror-puppet.workspace = true
crysirror-puppet-eluna = { path = "../crysirror-puppet-eluna" }
crysirror-script-js.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
image.workspace = true
glam.workspace = true
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
cap-std.workspace = true
gilrs = { version = "=0.11.2", optional = true }
crysirror-scene.workspace = true

# Native menu bar (Apache-2.0 OR MIT): macOS app menu, Windows HWND menu.
# Linux needs a GTK window (not a winit surface), so Linux retains the visible engine menu fallback.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.19.3", default-features = false }
core-foundation = "=0.10.1"
[target.'cfg(target_os = "windows")'.dependencies]
muda = { version = "=0.19.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Power", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3.12"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
