[package]
name = "crysirror-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
cpal-output = ["dep:cpal"]
# Compatibility device feature; the modern PCM bridge uses CPAL directly.
rodio-output = ["dep:rodio", "cpal-output"]

[dependencies]
crysirror-io.workspace = true
crysirror-resource.workspace = true
crysirror-core.workspace = true
crysirror-tasks.workspace = true
crysirror-acoustics.workspace = true
anyhow.workspace = true
crossbeam-queue = "=0.3.14"
cpal = { version = "=0.15.3", optional = true }
serde.workspace = true
serde_json.workspace = true
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
rodio = { version = "0.17.3", optional = true, default-features = false, features = ["wav", "vorbis", "mp3", "flac"] }

# Device-free native resource codecs, not the original engine runtime.
opus-decoder = "=0.1.1"
