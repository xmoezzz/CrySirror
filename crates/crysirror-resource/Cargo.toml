[package]
name = "crysirror-resource"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CPU archive registry, capability streams and scoped resource transforms"

[dependencies]
crysirror-io.workspace = true
crysirror-core.workspace = true
crysirror-tasks.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = "1.0"
aes = { version = "=0.8.4", features = ["zeroize"] }
ctr = { version = "=0.9.2", features = ["zeroize"] }
zeroize = "1.8"
blowfish = "=0.9.1"
num-bigint = "=0.4.8"
rsa = { version = "=0.9.9", features = ["sha2"] }
sha2 = "0.10.9"
base64 = "0.22.1"
blake2 = "=0.10.6"
lz4_flex = "=0.11.6"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
# Pure Rust content identification; embedded rules, no libmagic runtime/FFI.
pure-magic = "=0.4.1"
magic-db = "=0.6.0"
encoding_rs = "0.8"
quick-xml = "0.41"
msi = "=0.10.0"
cab = "=0.6.0"
pelite = { version = "=0.10.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.12"
