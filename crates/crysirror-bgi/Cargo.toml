[package]
name = "crysirror-bgi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Original BGI VM adapter using shared CrySirror image, text and capability storage"

[dependencies]
crysirror-core.workspace = true
crysirror-runtime.workspace = true
crysirror-scene.workspace = true
crysirror-image.workspace = true
crysirror-text.workspace = true
crysirror-audio.workspace = true
ethornell-audio = { path = "../bgi-upstream/crates/ethornell-audio", default-features = false, features = ["cpu-embedded"] }
ethornell-app = { path = "../bgi-upstream/crates/ethornell-app", default-features = false, features = ["cpu-embedded"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.12"
