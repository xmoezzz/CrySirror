[package]
name="ethornell-app"
version="0.1.0"
edition="2024"
license="MPL-2.0"
publish=false
autobins=false
autoexamples=false
autotests=false
autobenches=false
[features]
default=["cpu-embedded"]
cpu-embedded=[]
host-driven=[]
desktop-window=[]
console=[]
[dependencies]
crysirror-image.workspace = true
anyhow.workspace = true
ethornell-core={path="../ethornell-core"}
ethornell-archive={path="../ethornell-archive"}
ethornell-image={path="../ethornell-image"}
ethornell-script={path="../ethornell-script"}
ethornell-vm={path="../ethornell-vm",features=["cpu-embedded"]}
ethornell-render={path="../ethornell-render",default-features=false,features=["cpu-embedded"]}
ethornell-audio={path="../ethornell-audio",default-features=false,features=["cpu-embedded"]}
crysirror-core={path="../../../crysirror-core"}
na_mpeg2_decoder={path="../../../siglus-upstream/na_mpeg2_decoder",default-features=false}
ab_glyph="0.2"
encoding_rs="0.8"
serde_json="1"
tracing="0.1"
image={version="0.24.9",default-features=false,features=["png","jpeg","bmp","ico"]}
libc="0.2"
pelite={version="0.10",default-features=false,features=["std"]}
[lib]
test=false
doctest=false

[[test]]
name="capability_policy"
path="tests/capability_policy.rs"
