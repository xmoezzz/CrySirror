[package]
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
name = "siglus_scene_vm"
version = "1.0.0"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["rlib"]
test = false
doctest = false

[features]
# Replaces the monotonic clock with one advanced by hand
# (`platform_time::advance_virtual_clock`), for deterministic replays of the
# VM (examples/vm_replay.rs). Never enable it in a player.
virtual-clock = []
# CrySirror vendored profile features (all off for the embedding host):
# open the platform audio device in AudioHub.
native-audio = ["kira/cpal"]
# upstream wgpu renderer.
native-render = ["dep:wgpu", "dep:pollster"]
# upstream windowed hosts, desktop dialogs and IME.
# game network syscalls (HTTP GET/POST, Twitter).
native-net = ["dep:ureq"]
native-host = ["native-render", "native-audio", "native-net", "dep:winit", "dep:raw-window-handle", "dep:raw-window-handle", "dep:egui", "dep:egui-wgpu"]

[dependencies]
rustc-hash = "2"
anyhow = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "dds", "ico"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ab_glyph = "0.2.32"
ttf-parser = "0.25.1"
encoding_rs = "0.8"
eluna = { package = "eluna_rs", version = "0.1.0", path = "../eluna_rs" }
siglus_omv_decoder = { path = "../siglus_omv_decoder" }
na_mpeg2_decoder = { path = "../na_mpeg2_decoder" }
wmv_decoder = { package = "wmv-decoder", path = "../na_wmv_player" }
siglus_key_recovery = { path = "../siglus_key_recovery" }

siglus_assets = { path = "../siglus_assets" }
shion-xfile = { path = "../shion-xfile" }

serde_json = "1"

# CrySirror vendored profile: desktop only. Window/GPU/device crates are
# optional; the embedding host enables none of them (see UPSTREAM.md).
kira = { version = "0.9", default-features = false, features = ["mp3", "ogg", "flac", "wav"] }
wgpu = { version = "0.20", features = ["wgsl"], optional = true }
winit = { version = "=0.31.0-beta.3", optional = true }
pollster = { version = "0.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }
egui = { version = "0.28.1", optional = true }
egui-wgpu = { version = "0.28.1", optional = true }
ureq = { version = "2.10", optional = true }

[lints.rust]
warnings = "allow"

