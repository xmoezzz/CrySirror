[package]
name = "crysirror-acoustics"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version.workspace = true
publish = false
[features]
default = []
obvhs = ["dep:obvhs", "dep:glam-obvhs"]
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
parry3d = "=0.17.6"
obvhs = { version = "=0.4.0", optional = true, default-features = false }
glam-obvhs = { package = "glam", version = ">=0.33, <0.35", optional = true }
sofar = "=0.4.0"
fundsp = { version = "=0.23.0", default-features = false, features = ["std"] }
