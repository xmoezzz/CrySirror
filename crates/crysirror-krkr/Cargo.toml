[package]
name = "crysirror-krkr"
version.workspace = true
edition = "2024"
license = "MPL-2.0"
rust-version.workspace = true
publish = false
description = "KiriKiri TJS2/KAG semantic adapter onto CrySirror engine APIs"

[dependencies]
crysirror-core.workspace = true
crysirror-runtime.workspace = true
crysirror-resource.workspace = true
crysirror-text.workspace = true
crysirror-image.workspace = true
crysirror-video = { path = "../crysirror-video" }
eluna = { package = "crysirror-codec-emote", path = "../crysirror-codec-emote" }
crysirror-scene.workspace = true
crysirror-tasks.workspace = true
crysirror-puppet.workspace = true
crysirror-puppet-eluna.workspace = true
crysirror-tjs2.workspace = true
crysirror-kag.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
lz4_flex = { version = "=0.11.6", default-features = false, features = ["safe-encode", "safe-decode"] }
encoding_rs = "0.8"
base64 = "0.22"
crc32fast = "1.5"
web-time = "1"

[dev-dependencies]
lz4_flex = { version = "=0.11.6", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
crysirror-formats-arc.workspace = true
tempfile = "3.12"
image.workspace = true
