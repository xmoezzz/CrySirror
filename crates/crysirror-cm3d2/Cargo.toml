[package]
name = "crysirror-cm3d2"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Custom Maid 3D 2 native semantics for CrySirror (adopt mode)"
autoexamples = false
autobenches = false

[lib]
doctest = false

[features]
runtime = ["dep:crysirror-runtime"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", features = ["clock", "wasmbind"] }
crysirror-kag.workspace = true
crysirror-asset.workspace = true
crysirror-image.workspace = true
glam.workspace = true
crysirror-tjs2.workspace = true
crysirror-runtime = { workspace = true, optional = true }
crysirror-resource.workspace = true
crysirror-core.workspace = true
crysirror-unity.workspace = true
crysirror-dotnet.workspace = true
crysirror-audio.workspace = true
unicode-segmentation = "1.13.3"
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.12"
crysirror-asset.workspace = true
crysirror-core.workspace = true
crysirror-resource.workspace = true
crysirror-formats-arc.workspace = true
